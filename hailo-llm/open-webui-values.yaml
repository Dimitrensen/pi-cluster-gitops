# These two keys belong to the Open WebUI chart. enabled: false stops the
# chart from deploying its own model server. The address is our hailo-qwen
# Service, which points at the host API on ai-pi.
ollama:
  enabled: false

ollamaUrls:
  - http://hailo-qwen.hailo-llm.svc.cluster.local:8000

# The Hailo path does not need the optional bundled services initially.
pipelines:
  enabled: false

tika:
  enabled: false

websocket:
  manager: ""

redis:
  enabled: false

nodeSelector:
  kubernetes.io/hostname: ai-pi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

persistence:
  enabled: true
  size: 2Gi
  storageClass: local-path

# 30081 avoids colliding with the legacy Open WebUI service on 30080 while the
# new Hailo-backed path is validated.
service:
  type: NodePort
  nodePort: 30081
