# These two keys are the Open WebUI chart's own names. The chart defaults
# ollama.enabled to true and would install its model server in the cluster.
# false is the off switch. ollamaUrls is copied into OLLAMA_BASE_URLS, which
# is how that program finds a model API. The address is the hailo-qwen Service.
ollama:
  enabled: false

ollamaUrls:
  - http://hailo-qwen.hailo-llm.svc.cluster.local:8000

# Open WebUI otherwise keeps the first saved URL in its database and ignores
# later changes to the chart URL above. False makes this chart value win on each start.
# The Hailo API returns HTTP 500 for a tools list and for keep_alive as text.
# Open WebUI shows that as "Server Connection Error". These settings leave
# one plain chat request: no builtin tools, no title, tags, or follow-up call.
extraEnvVars:
  - name: ENABLE_PERSISTENT_CONFIG
    value: "False"
  - name: ENABLE_TITLE_GENERATION
    value: "False"
  - name: ENABLE_TAGS_GENERATION
    value: "False"
  - name: ENABLE_FOLLOW_UP_GENERATION
    value: "False"
  - name: DEFAULT_MODEL_PARAMS
    value: '{"function_calling":"legacy"}'
  - name: DEFAULT_MODEL_METADATA
    value: '{"capabilities":{"builtin_tools":false},"builtinTools":{"time":false,"user_input":false,"files":false,"knowledge":false,"chats":false,"subagents":false,"memory":false,"web_search":false,"image_generation":false,"video_generation":false,"code_interpreter":false,"notes":false,"channels":false,"skills":false,"tools":false,"tasks":false,"automations":false,"calendar":false,"notifications":false,"visualizations":false}}'

# The Hailo path does not need the optional bundled services initially.
pipelines:
  enabled: false

tika:
  enabled: false

websocket:
  manager: ""

redis:
  enabled: false

nodeSelector:
  kubernetes.io/hostname: ai-pi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

persistence:
  enabled: true
  size: 2Gi
  storageClass: local-path

# 30081 avoids colliding with the legacy Open WebUI service on 30080 while the
# new Hailo-backed path is validated.
service:
  type: NodePort
  nodePort: 30081
