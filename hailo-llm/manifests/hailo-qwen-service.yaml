# Stable in-cluster DNS name for the host Hailo API on ai-pi.
# CoreDNS must resolve the Tailscale MagicDNS name.
apiVersion: v1
kind: Service
metadata:
  name: hailo-qwen
  namespace: hailo-llm
  labels:
    app.kubernetes.io/part-of: hailo-llm
spec:
  type: ExternalName
  externalName: ai-pi.tail021710.ts.net
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
