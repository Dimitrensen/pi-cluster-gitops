ollama:
  # Instructs the pod to automatically pull a model into memory when it boots
  models:
    pull:
      - llama3.1

# Pin the pod to your 16GB AI node, completely avoiding the 8GB nodes
nodeSelector:
  hardware-type: high-mem

# Hard limits to safeguard the 16GB Pi from Out-Of-Memory crashes
resources:
  requests:
    memory: "8Gi"
    cpu: "2000m"
  limits:
    memory: "14Gi"