ollama:
  # Downloaded on container start only if the file is missing from the PVC.
  # models.run is left off so the model is not loaded into RAM until WebUI calls it.
  models:
    pull:
      - llama3.2:3b

# Chart reads this at the root. Nested under ollama: it is ignored.
extraEnv:
  - name: OLLAMA_METRICS
    value: "true"

# Pins the pod to the 16GB AI node, completely avoiding the 8GB nodes
nodeSelector:
  hardware-type: high-mem

# Hard limits to safeguard the 16GB SBC from Out-Of-Memory crashes
resources:
  requests:
    memory: "8Gi"
    cpu: "2000m"
  limits:
    memory: "14Gi"

service:
  type: NodePort
  nodePort: 31434

persistentVolume:
  enabled: true
  size: 20Gi
  storageClass: local-path

initContainers:
  - name: wait-for-dns
    image: busybox:1.36
    command: ['sh', '-c', 'until nslookup registry.ollama.ai; do echo waiting for DNS; sleep 2; done']