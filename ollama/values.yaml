ollama:
  # # Instructs the pod to automatically pull a model into memory when it boots
  # models:
  #   pull:
  #     - llama3.1
  extraEnv:
    - name: OLLAMA_METRICS
      value: "true"

# Pins the pod to the 16GB AI node, completely avoiding the 8GB nodes
nodeSelector:
  hardware-type: high-mem

# Hard limits to safeguard the 16GB SBC from Out-Of-Memory crashes
resources:
  requests:
    memory: "8Gi"
    cpu: "2000m"
  limits:
    memory: "14Gi"

service:
  type: NodePort
  nodePort: 31434

persistence:
  enabled: true
  size: 20Gi
  storageClass: local-path

extraInitContainers:
  - name: wait-for-dns
    image: busybox:1.36
    command: ['sh', '-c', 'until nslookup registry.ollama.ai; do echo waiting for DNS; sleep 2; done']