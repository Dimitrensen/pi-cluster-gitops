# Registered by pi-cluster-root. Sync this app on its own. Open WebUI stays
# pinned to ai-pi and calls the host Hailo API on port 8000.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hailo-qwen
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: pi-cluster-gitops
    app.kubernetes.io/component: llm-ui
spec:
  project: default
  sources:
    - repoURL: https://helm.openwebui.com
      chart: open-webui
      targetRevision: 3.1.0
      helm:
        valueFiles:
          - $values/hailo-llm/open-webui-values.yaml
    - repoURL: https://github.com/Dimitrensen/pi-cluster-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Dimitrensen/pi-cluster-gitops.git
      targetRevision: main
      path: hailo-llm/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: hailo-llm
  # Manual until the host API is healthy. Same end state as pi-cluster-root:
  # self-heal on, prune off. Uncommenting automated also syncs new commits.
  syncPolicy:
    # automated:
    #   selfHeal: true
    #   prune: false
    syncOptions:
      - CreateNamespace=true
