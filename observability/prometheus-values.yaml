server:
  nodeSelector:
    kubernetes.io/hostname: argo-pi
  retention: 2d
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  persistentVolume:
    enabled: true
    size: 5Gi
    storageClass: local-path

alertmanager:
  enabled: false

kube-state-metrics:
  enabled: true

nodeExporter:
  enabled: true
