apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 25.27.0
      helm:
        valueFiles:
          - $values/observability/prometheus-values.yaml
    - repoURL: https://grafana.github.io/helm-charts
      chart: grafana
      targetRevision: 8.5.0
      helm:
        valueFiles:
          - $values/observability/grafana-values.yaml
    - repoURL: https://github.com/Dimitrensen/pi-cluster-gitops.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true